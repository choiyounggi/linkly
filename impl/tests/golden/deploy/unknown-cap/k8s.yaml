# Generated by `lnpl generate k8s` (issue #189). Re-run the generator instead of editing.
# Referenced, not generated: the ConfigMap "unknown-cap-source" holding app.lnpl, and the Secret "unknown-cap-secrets" when secretKeyRef entries exist. docs/backends.md section 12 has the kubectl create commands.
apiVersion: v1
kind: ConfigMap
metadata:
  name: "unknown-cap-config"
  labels:
    "app.kubernetes.io/name": "unknown-cap"
data:
  "LNPL_SOURCE": "/srv/lnpl/app.lnpl"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "unknown-cap"
  labels:
    "app.kubernetes.io/name": "unknown-cap"
spec:
  # PLACEHOLDER: replica count is not known to the generator; set with --set replicas=N.
  replicas: 1
  selector:
    matchLabels:
      "app.kubernetes.io/name": "unknown-cap"
  template:
    metadata:
      labels:
        "app.kubernetes.io/name": "unknown-cap"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: "app"
          # PLACEHOLDER: set the image with --set image=ghcr.io/<owner>/linkly:<X.Y> (no latest tag is published).
          image: "ghcr.io/OWNER/linkly:VERSION"
          ports:
            - name: "http"
              containerPort: 8000
          envFrom:
            - configMapRef:
