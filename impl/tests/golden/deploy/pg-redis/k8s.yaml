# Generated by `lnpl generate k8s` (issue #189). Re-run the generator instead of editing.
# Referenced, not generated: the ConfigMap "pg-redis-source" holding app.lnpl, and the Secret "pg-redis-secrets" when secretKeyRef entries exist. docs/backends.md section 12 has the kubectl create commands.
apiVersion: v1
kind: ConfigMap
metadata:
  name: "pg-redis-config"
  labels:
    "app.kubernetes.io/name": "pg-redis"
data:
  "LNPL_SOURCE": "/srv/lnpl/app.lnpl"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "pg-redis"
  labels:
    "app.kubernetes.io/name": "pg-redis"
spec:
  # PLACEHOLDER: replica count is not known to the generator; set with --set replicas=N.
  replicas: 1
  selector:
    matchLabels:
      "app.kubernetes.io/name": "pg-redis"
  template:
    metadata:
      labels:
        "app.kubernetes.io/name": "pg-redis"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: "app"
          # PLACEHOLDER: set the image with --set image=ghcr.io/<owner>/linkly:<X.Y> (no latest tag is published).
          image: "ghcr.io/OWNER/linkly:VERSION"
          ports:
            - name: "http"
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: "pg-redis-config"
          env:
            - name: "LNPL_BACKEND"
              valueFrom:
                secretKeyRef:
                  name: "pg-redis-secrets"
                  key: "LNPL_BACKEND"
            - name: "LNPL_CACHE"
              valueFrom:
                secretKeyRef:
                  name: "pg-redis-secrets"
                  key: "LNPL_CACHE"
          livenessProbe:
            httpGet:
              path: "/-/healthz"
              port: "http"
          readinessProbe:
            httpGet:
              path: "/-/readyz"
              port: "http"
          # PLACEHOLDER: no resources set (BestEffort QoS); measure, then set --set cpu_request=... cpu_limit=... memory=...
          volumeMounts:
            - name: "source"
              mountPath: "/srv/lnpl"
              readOnly: true
      volumes:
        - name: "source"
          configMap:
            name: "pg-redis-source"
---
apiVersion: v1
kind: Service
metadata:
  name: "pg-redis"
  labels:
    "app.kubernetes.io/name": "pg-redis"
spec:
  selector:
    "app.kubernetes.io/name": "pg-redis"
  ports:
    - name: "http"
      port: 8000
      targetPort: "http"
