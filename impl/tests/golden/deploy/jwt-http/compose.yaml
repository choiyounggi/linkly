# Generated by `lnpl generate compose` (issue #189). Re-run the generator instead of editing.
# PLACEHOLDER lines mark values the generator cannot know; docs/backends.md section 12 lists every option.
services:
  app:
    # PLACEHOLDER: set the image with --set image=ghcr.io/<owner>/linkly:<X.Y> (no latest tag is published).
    image: "ghcr.io/OWNER/linkly:VERSION"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      "LNPL_SOURCE": "/srv/lnpl/app.lnpl"
      "LNPL_JWT_SECRET_ENV": "LNPL_JWT_SECRET"
      "LNPL_JWT_SECRET": "${LNPL_JWT_SECRET:?set LNPL_JWT_SECRET before docker compose up}"
      # PLACEHOLDER: base URL of this network target.
      "LNPL_ENDPOINT_PAYMENTGATEWAY": "http://endpoint-placeholder.invalid"
      # PLACEHOLDER: base URL of this network target.
      "LNPL_ENDPOINT_ORDERSAPI": "http://endpoint-placeholder.invalid"
    volumes:
      # PLACEHOLDER: path of the .lnpl source, relative to this file; set with --set source=PATH.
      - type: bind
        source: "./app.lnpl"
        target: "/srv/lnpl/app.lnpl"
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/-/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
