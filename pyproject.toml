[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lnpl"
version = "0.9.1.dev0"
description = "LNPL — the surface language, Semantic IR, and runtime of the linkly LLM-native programming platform"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = { file = "LICENSE" }
dependencies = ["jsonschema"]

[project.scripts]
lnpl = "lnpl.cli:main"

# Pinned exactly, not floated: a new ruff release can add rules to a selected
# family, which turns a green CI red with no change to this repo's code.
[project.optional-dependencies]
lint = ["ruff==0.16.5"]

# Not published (PEP 735): pinned tool inputs for the hashed lockfiles that
# CI and the two Dockerfiles install from (issue #243). Regenerate: docs/CI-GATES.md.
[dependency-groups]
build = ["build==1.6.1", "hatchling==1.33.0"]
coverage = ["coverage==7.17.2"]
serve = ["gunicorn==26.2.0"]
audit = ["pip-audit==2.10.1"]

[tool.hatch.build.targets.wheel]
packages = ["impl/lnpl"]
force-include = { "mlir/lnpl.irdl.mlir" = "lnpl/assets/mlir/lnpl.irdl.mlir", "mlir/llvm.pin" = "lnpl/assets/mlir/llvm.pin", "kb" = "lnpl/assets/kb" }

# No `target-version` here on purpose: ruff derives it from `requires-python`
# above, so the Python floor stays declared in exactly one place.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
