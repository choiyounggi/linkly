[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lnpl"
version = "0.5.0"
description = "LNPL — the surface language, Semantic IR, and runtime of the linkly LLM-native programming platform"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["jsonschema"]

[project.scripts]
lnpl = "lnpl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["impl/lnpl"]
force-include = { "mlir/lnpl.irdl.mlir" = "lnpl/assets/mlir/lnpl.irdl.mlir", "mlir/llvm.pin" = "lnpl/assets/mlir/llvm.pin", "kb" = "lnpl/assets/kb" }
