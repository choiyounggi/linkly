# Reference nginx config — TLS termination in front of the gunicorn
# container this directory's Dockerfile builds (issue #148). Not part of
# this repo's own CI/release pipeline (same posture as the Dockerfile,
# README.md "무엇을 서빙하는가") — a documented starting point for an
# operator who wants TLS + a real reverse proxy in front of `lnpl.wsgi:
# build_app()` under gunicorn, matching docs/serving.md's "운영 배치" split
# (gunicorn: WSGI/worker management; nginx: TLS termination + reverse
# proxy — this file is the nginx half of that split).
#
# TLS profile: Mozilla's "intermediate" configuration (TLS 1.2 + 1.3,
# ssl-config.mozilla.org, generator version 5.7 — broad client
# compatibility while dropping legacy/weak ciphers; the "modern" profile
# would be TLS 1.3-only, which is stricter than this reference needs to be
# by default). Adjust `ssl_certificate`/`ssl_certificate_key` and the
# `server_name` to your own domain + cert before using this outside a demo.

# --- http: redirect everything to https ---
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- https: TLS termination + reverse proxy to gunicorn ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Mozilla intermediate profile (ssl-config.mozilla.org, generator 5.7).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # OCSP stapling (Mozilla intermediate profile default: on).
    ssl_stapling on;
    ssl_stapling_verify on;

    # `/-/healthz`/`/-/readyz` pass through unchanged -- a k8s/orchestrator
    # probe that talks to nginx (rather than the gunicorn container
    # directly) must see the exact same ops surface docs/serving.md "운영
    # 표면" defines (no auth, no rate limit -- issue #148, D1's own `/-/`
    # exemption already covers these at the WSGI layer; nginx does not
    # re-implement that here, it just does not get in the way of it).
    location /-/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # gunicorn's own --graceful-timeout (default 30s, docs/serving.md
        # "SIGTERM 그레이스풀 드레인" 절) needs nginx to hold the client
        # connection open at least that long during a rolling deploy, or
        # nginx would give up and 502 before gunicorn finishes draining.
        proxy_read_timeout 30s;
    }
}
