name: AI gates (quality)

# 품질 AI 게이트 2종의 호출부. 판정 배관은 여기 없다 —
# `.github/workflows/_ai-gate.yml`이 전부 가지고 있고(포크 차단, SHA 핀,
# 시크릿/변경파일 0건 skip, `scripts/ai_gate_verdict.py`의 exit code 판정),
# 이 파일은 게이트 이름·프롬프트 파일·advisory 여부만 넘긴다.
# 로스터와 승격 절차는 `docs/CI-GATES.md`.
#
# D2: 트리거는 `pull_request` 하나뿐이다. 포크 PR을 베이스 레포 컨텍스트에서
# 돌리는 트리거는 쓰지 않는다 — 포크 코드 체크아웃 + 시크릿은 RCE·시크릿 유출
# 패턴이고, 포크 PR 차단은 `_ai-gate.yml`의 잡 조건이 이미 맡고 있다.
#
# D3: `paths` 필터가 없다 — 두 게이트 모두 모든 PR에서 돈다.
# `prose-factcheck`은 정의상 모든 PR의 산문을 보고, 잡 둘이 한 파일에 있으므로
# `test-quality`도 같이 돈다. 그래서 `test-quality`는 테스트를 하나도 건드리지
# 않은 PR에서도 실행된다 — 그 경우에도 프롬프트가 "읽은 파일을 전부
# `examined.files`에 싣고 `examined.note`에 그 사실을 적는다"를 강제한다(D4).
# 비워서 `pass`를 내면 `expect_nonempty: true` 때문에 exit 3(공허한 통과)로
# 잡이 죽는다 — advisory여도 죽는다(exit 2·3은 blocking과 무관).

on:
  pull_request:

# `_ai-gate.yml`이 워크플로 레벨에 `contents: read` + `pull-requests: write`를
# 선언한다(`use_sticky_comment`가 PR 코멘트를 쓴다). 재사용 워크플로의 권한은
# 호출부가 가진 GITHUB_TOKEN 범위를 넘을 수 없으므로, 호출부가 아무것도
# 선언하지 않으면 레포 기본값이 그 상한이 된다 — 기본값이 read-only면
# `workflow_call` 자체가 죽고, 그 죽음은 advisory와 무관하다. 이 레포는
# `release.yml`에서 이미 필요한 잡마다 권한을 명시하는 관례를 쓴다. 여기 적힌
# 둘은 `_ai-gate.yml`이 요구하는 것과 정확히 같은 범위다 — 권한을 넓히지 않는다.
permissions:
  contents: read
  pull-requests: write

jobs:
  test-quality:
    uses: ./.github/workflows/_ai-gate.yml
    with:
      gate_name: test-quality
      prompt_file: .github/ai-gates/test-quality.md
      # D6: 2026-10-22 승격(issue #244). 승격 기준(약 50 PR, 수용률 80%)을
      # 채우기 전의 예외다 — 근거와 실측은 docs/CI-GATES.md "advisory → blocking
      # 승격 절차". 이 잡 키와 재사용 잡 id(gate)가 required check
      # `test-quality / gate`를 이룬다 — 이 잡 이름을 바꾸거나, 이 잡에 if:를
      # 달거나, pull_request: 아래에 types/branches/paths를 넣으면 보호 브랜치가
      # 영영 보고되지 않는 체크를 기다린다.
      blocking: true
      # D5: D4가 성립시켜 준다 — 어떤 PR에서도 읽은 파일이 실리므로
      # 공허한 통과 보호를 끌 이유가 없다.
      expect_nonempty: true
      paths_note: "impl/tests/** 의 변경분"
    # D7: `secrets: inherit` 금지. 이 게이트가 무엇에 의존하는지 호출부에서
    # 보여야 하고, 재사용 워크플로에 필요 없는 시크릿까지 넘기지 않는다.
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  prose-factcheck:
    uses: ./.github/workflows/_ai-gate.yml
    with:
      gate_name: prose-factcheck
      prompt_file: .github/ai-gates/prose-factcheck.md
      blocking: false
      expect_nonempty: true
      paths_note: "PR 산문과 diff 전체"
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # generic-http는 두 번째 러너다(issue #252, 조정 판정 R-t252-1). 위 잡과 같은
  # 게이트를 OpenAI 호환 엔드포인트로 한 번 더 돌린다. 리포지토리 변수
  # `AI_GATE_HTTP_BASE_URL`이 등록돼야만 돌고, 그 전에는 Skipped 체크로 보인다.
  # D7과 같이 `secrets: inherit` 없이 HTTP 키 하나만 넘긴다. 동시성 그룹은
  # `_ai-gate.yml`이 러너 접미사로 따로 잡는다. 등록 절차는 `docs/CI-GATES.md`.
  test-quality-generic-http:
    if: vars.AI_GATE_HTTP_BASE_URL != ''
    uses: ./.github/workflows/_ai-gate.yml
    with:
      gate_name: test-quality
      prompt_file: .github/ai-gates/test-quality.md
      blocking: false
      expect_nonempty: true
      paths_note: "impl/tests/** 의 변경분"
      runner: generic-http
      http_base_url: ${{ vars.AI_GATE_HTTP_BASE_URL }}
      http_model: ${{ vars.AI_GATE_HTTP_MODEL }}
      http_api_style: ${{ vars.AI_GATE_HTTP_API_STYLE }}
    secrets:
      ai_gate_http_api_key: ${{ secrets.AI_GATE_HTTP_API_KEY }}

  prose-factcheck-generic-http:
    if: vars.AI_GATE_HTTP_BASE_URL != ''
    uses: ./.github/workflows/_ai-gate.yml
    with:
      gate_name: prose-factcheck
      prompt_file: .github/ai-gates/prose-factcheck.md
      blocking: false
      expect_nonempty: true
      paths_note: "PR 산문과 diff 전체"
      runner: generic-http
      http_base_url: ${{ vars.AI_GATE_HTTP_BASE_URL }}
      http_model: ${{ vars.AI_GATE_HTTP_MODEL }}
      http_api_style: ${{ vars.AI_GATE_HTTP_API_STYLE }}
    secrets:
      ai_gate_http_api_key: ${{ secrets.AI_GATE_HTTP_API_KEY }}
