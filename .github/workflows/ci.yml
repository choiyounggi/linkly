name: CI

# issue #141 phase 1: the automated form of docs/RELEASING.md's completion
# gate. `scripts/dev_doctor.sh` is a local contributor-environment doctor
# (interpreter/venv/toolchain presence) and does not run here — a GitHub-hosted
# runner is provisioned fresh every time, so those checks are moot in CI.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    name: gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install .

      - name: Test suite (mode B toolchain excluded — issue #141 phase 1)
        run: |
          # impl/tests/test_repo_state.py is excluded here by literal module
          # name, not by filename pattern. Its own module docstring documents
          # "This module never skips, on purpose": it is issue #35's outermost
          # regression and the MLIR/LLVM toolchain is the only thing that
          # exercises its mode-B half, so it must NOT gain a skipUnless guard —
          # that would let the coverage evaporate silently on any machine
          # without the toolchain (see AGENTS.md's note on mode B failures).
          # This runner does not install that toolchain in phase 1 of issue
          # #141, so the module is excluded here instead — loudly, by name.
          # Remove this exclusion once a mode-B toolchain CI job exists.
          echo "excluded from CI discovery (mode B toolchain unavailable, issue #141 phase 1): tests.test_repo_state"
          PYTHONPATH=impl python3 <<'PY'
          import os
          import sys
          import unittest

          EXCLUDED = {"test_repo_state"}
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for fname in sorted(os.listdir("impl/tests")):
              if not (fname.startswith("test_") and fname.endswith(".py")):
                  continue
              module = fname[:-3]
              if module in EXCLUDED:
                  continue
              suite.addTests(loader.loadTestsFromName("tests." + module))

          runner = unittest.TextTestRunner(verbosity=1)
          result = runner.run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

      - name: RFC lint
        run: python scripts/rfc_lint.py

      - name: Plugin reference drift check
        run: python scripts/gen_plugin_references.py --check

      - name: Version sync check (issue #141)
        run: python scripts/check_version_sync.py

      - name: Doc snippet compile gate
        run: python scripts/check_doc_snippets.py

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && pip install '.[lint]'

      - name: Ruff (impl/lnpl and scripts only — impl/tests excluded by name)
        run: |
          # impl/tests is excluded here by literal path, not by a pattern and
          # not by a per-rule ignore. Measured on the integration tip: the same
          # rule set (E4,E7,E9,F) reports 79 violations across the full tree and
          # all 79 of them live in impl/tests (E741x54, F401x17, F841x5,
          # E402x2, E401x1). Gating the full tree would land red on day one and
          # teach the next contributor to route around this job. Cleaning
          # impl/tests is a separate backlog item, not this gate's job — so the
          # exclusion is stated out loud, the same way the test step above
          # states its test_repo_state exclusion. Drop this exclusion once
          # impl/tests is at zero.
          echo "excluded from the ruff gate (79 pre-existing E4/E7/E9/F violations, separate backlog): impl/tests"
          echo "gated paths: impl/lnpl scripts"
          # No --select / --isolated here on purpose: the rule set and the
          # Python target both come from pyproject.toml, so this command and a
          # contributor's local `ruff check` cannot disagree.
          ruff check impl/lnpl scripts
