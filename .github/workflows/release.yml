name: Release

# Tag-triggered release (issue #141; PyPI publishing enabled by issue #245):
# gates -> build -> release (GitHub Release) -> publish-pypi (PyPI through
# Trusted Publishing and the `pypi` environment), plus gates -> image (GHCR).
# gates first checks that the tag equals pyproject.toml's version.
# Registration values, the `pypi` environment prerequisite and the recovery
# when publish-pypi fails after the GitHub Release exists: docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

jobs:
  gates:
    name: gates (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag matches the pyproject version (issue #245)
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches pyproject.toml version $version"

      - name: Install
        run: python -m pip install --upgrade pip && pip install .

      - name: Test suite (mode B toolchain excluded — issue #141 phase 1)
        run: |
          # impl/tests/test_repo_state.py is excluded here by literal module
          # name, not by filename pattern. Its own module docstring documents
          # "This module never skips, on purpose": it is issue #35's outermost
          # regression and the MLIR/LLVM toolchain is the only thing that
          # exercises its mode-B half, so it must NOT gain a skipUnless guard —
          # that would let the coverage evaporate silently on any machine
          # without the toolchain (see AGENTS.md's note on mode B failures).
          # This job's legs have no mode-B toolchain either, so test_repo_state
          # stays excluded here — but it is no longer uncovered: ci.yml's
          # modeb-linux job installs the pinned LLVM/MLIR toolchain and runs it
          # directly (issue #161).
          echo "excluded from CI discovery (no mode-B toolchain on this job's legs — covered by ci.yml's modeb-linux job instead, issue #161): tests.test_repo_state"
          PYTHONPATH=impl python3 <<'PY'
          import os
          import sys
          import unittest

          EXCLUDED = {"test_repo_state"}
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for fname in sorted(os.listdir("impl/tests")):
              if not (fname.startswith("test_") and fname.endswith(".py")):
                  continue
              module = fname[:-3]
              if module in EXCLUDED:
                  continue
              suite.addTests(loader.loadTestsFromName("tests." + module))

          runner = unittest.TextTestRunner(verbosity=1)
          result = runner.run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

      - name: RFC lint
        run: python scripts/rfc_lint.py

      - name: Plugin reference drift check
        run: python scripts/gen_plugin_references.py --check

      - name: Version sync check (issue #141)
        run: python scripts/check_version_sync.py

  build:
    name: build sdist + wheel
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip && pip install build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # issue #154: the tag name is untrusted input from outside the repo
      # (github.ref_name). Never interpolate `${{ }}` directly into a `run:`
      # block — GitHub's script-injection hardening guide requires routing
      # such values through an intermediate env var first:
      # https://docs.github.com/en/actions/reference/security/secure-use
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Extract release notes from CHANGELOG (issue #154)
        run: |
          python scripts/changelog_section.py "$TAG" > notes.md
          python scripts/changelog_section.py "$TAG" --title > title.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$(cat title.txt)" \
            --notes-file notes.md

  image:
    name: build + push container image (issue #190)
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # same rationale as the `release` job's TAG above (issue #154): never
      # interpolate `${{ github. }}` directly into a `run:` block.
      TAG: ${{ github.ref_name }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tags (issue #190)
        id: vars
        run: |
          owner_lc="$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lc}/linkly"
          core="${TAG#v}"
          core="${core%%-*}"
          xy="$(cut -d. -f1-2 <<< "$core")"
          {
            echo "tags<<TAGEOF"
            echo "${image}:${TAG}"
            if [[ "$TAG" != *-* ]]; then
              echo "${image}:${xy}"
            fi
            echo "TAGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build image for the local smoke
        run: docker build -f docker/Dockerfile -t linkly-smoke:ci .

      - name: Smoke test (same commands as the local check in docs/RELEASING.md)
        run: |
          docker run --rm -d --name linkly-smoke -p 8000:8000 \
            -v "$PWD/examples/linkhub.lnpl:/data/linkhub.lnpl:ro" \
            -e LNPL_SOURCE=/data/linkhub.lnpl \
            -e LNPL_BACKEND=fake -e LNPL_CLOCK=virtual \
            linkly-smoke:ci
          sleep 3
          status="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/-/healthz)"
          docker logs linkly-smoke > smoke.log 2>&1
          docker stop linkly-smoke
          cat smoke.log
          if [ "$status" != "200" ]; then
            echo "healthz returned $status, expected 200"
            exit 1
          fi
          if grep -q "ERROR" smoke.log; then
            echo "smoke container log contains an ERROR line"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (SBOM + provenance attestations)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          # the runner is linux/amd64 only; no QEMU/cross-build setup exists
          # in this job, so this is stated explicitly rather than left to
          # buildx's default (the base image's digest is a multi-platform
          # index, but this job does not build every platform in it).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          sbom: true
          provenance: true

  # PyPI publishing through Trusted Publishing (issue #245): PyPI accepts this
  # job's OIDC token for owner choiyounggi, repository linkly, workflow
  # release.yml and environment pypi; the token permission below is the job's
  # only one. needs: [build, release] keeps the irreversible upload last: a
  # failed gates, build or release job skips this job, so PyPI never gets a
  # version whose GitHub Release was not created. Recovery: docs/RELEASING.md.
  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: [build, release]
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
